<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Zigrow — Social Influencer Hero</title>

    <!-- Bootstrap (utilities only are fine) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Compiled CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header id="header" data-section="header" class="site-header" aria-hidden="true"></header>

    <main>
      <section id="hero" data-section="hero" class="influencer-hero">
        <div class="container">
          <div class="hero-wrap row" data-zg-editable="surface">
            <!-- Text side -->
            <div class="hero-copy col-12 col-lg-7">
              <div class="hero-section-header">
                <h4 class="hero-subtitle">Social Media Influencer</h4>

                <h1 class="hero-title">
                  Connect to grow <br />
                  <span class="type-holder">your business</span>
                </h1>

                <p class="hero-sub">
                  Find and connect with influencers, vloggers, journalists,
                  podcasters and more who fit your social media goals across niches
                </p>
              </div>

              <div class="hero-section-body">
                <div class="cta-row hero-actions zg-align-center">
                  <a href="tel:+919876543210" class="btn-pill primary" data-btn="hero">
                    <i class="bi bi-telephone-forward-fill" data-icon="telephone-forward" aria-hidden="true"></i>Call Now
                  </a>
                </div>

                <div class="social-icons">
                  <a href="#" aria-label="Facebook"><i class="bi bi-facebook" data-icon="facebook" aria-hidden="true"></i></a>
                  <a href="#" aria-label="Instagram"><i class="bi bi-instagram" data-icon="instagram" aria-hidden="true"></i></a>
                  <a href="#" aria-label="YouTube"><i class="bi bi-youtube" data-icon="youtube" aria-hidden="true"></i></a>
                  <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin" data-icon="linkedin" aria-hidden="true"></i></a>
                  <a href="#" aria-label="WhatsApp"><i class="bi bi-whatsapp" data-icon="whatsapp" aria-hidden="true"></i></a>
                </div>
              </div>
            </div>

            <!-- Visual side -->
            <div class="hero-visual col-12 col-lg-5">
              <div class="blob"></div>

              <figure class="photo">
                <img
                  src="assets/image/webcard-hero.webp"
                  alt="Happy creator recording selfie"
                />
              </figure>

              <!-- Floating chips -->
              <div class="chip chip-sm chip-twitter" aria-hidden="true">
                <i class="bi bi-twitter" data-icon="twitter"></i>
              </div>

              <div
                class="chip chip-lg chip-counter"
                role="status"
                aria-live="polite"
              >
                <img
                  class="avatar"
                  src="assets/image/creator-avatar-12.webp"
                  alt="Creator profile avatar"
                />
                <div class="count">
                  <strong>5212</strong>
                  <span>Followers</span>
                </div>
              </div>

              <div
                class="chip chip-md chip-name"
                role="group"
                aria-label="Profile name"
              >
                <div class="meta">
                  <strong class="name">Arun</strong>
                  <span class="role">Social Influencer</span>
                </div>
              </div>

              <div class="chip chip-mini group-avatars" aria-hidden="true">
                <img src="assets/image/creator-avatar-7.webp" alt="" />
                <img src="assets/image/creator-avatar-11.webp" alt="" />
                <img src="assets/image/creator-avatar-5.webp" alt="" />
                <img src="assets/image/creator-avatar-21.webp" alt="" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer" data-section="footer" class="site-footer">
      <div class="container">
        <div class="row powered-by-zigrow-row">
          <div class="col-12">
            <a href="https://zigrow.com" target="_blank" rel="nofollow sponsored noopener noreferrer">Powered by Zigrow</a>
          </div>
        </div>
      </div>
    </footer>

  </body>
</html>
