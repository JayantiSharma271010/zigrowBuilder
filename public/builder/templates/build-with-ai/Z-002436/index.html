    :root {
      --para-muted: #6B7280;

      --territory-colors: #D9DBF1;
      --theme-3: #ffffff;

      /* global btn style */
      --btn-padding: 8px 16px;
      --btn-padding-sm: "0.78rem 2rem";
      --btn-font-size: 14px;
      --btn-font-size-sm:  "0.84rem";
      --btn-font-weight: 500;
      --btn-box-shadow: none;
      --btn-box-shadow-hover: 0 4px 10px rgba(0,0,0,0.06);
      --btn-transition: all 0.3s ease;
      --btn-backdrop-filter: blur(6px) saturate(140%);
      --btn-letter-spacing: 0.5px;
      --btn-bg-color: #2C2C2C;

      /* global box shadow */


      --shadow-section: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-section-hover: 0 6px 16px rgba(0,0,0,0.08);
      --shadow-section-primary:
        0 14px 36px color-mix(in srgb, var(--primary-colors) 28%, transparent),
        0 6px 18px rgba(0, 0, 0, 0.12);

      /* global text scale for responsiveness */
      --text-scale: 1;
      /* Font size */
      --fs-body-base: 15.5px;
      --fs-body-base-sm: '14px';
      --fs-sub-base: 18px;
      --fs-h3-base: 48px;
      --fs-h2-base: clamp(1.6rem, 1.15rem + 1.8vw, 2.4rem);
      --fs-h1-base: 48px;

      /* computed sizes (global scale apply hota hai) */
      --fs-body: calc(var(--fs-body-base) * var(--text-scale));
      --fs-body-sm: calc(var(--fs-body-base-sm) * var(--text-scale));
      --fs-sub: calc(var(--fs-sub-base) * var(--text-scale));
      --fs-h3: calc(var(--fs-h3-base) * var(--text-scale));
      --fs-h2: calc(var(--fs-h2-base) * var(--text-scale));
      --fs-h1: calc(var(--fs-h1-base) * var(--text-scale));

      /* line-heights */
      --lh-body: 1.75;
      --lh-head: 1.2;




    }

    /* breakpoints  (sab blocks auto adjust) */
    @media (max-width: 768px) {
      :root {
        --text-scale: 0.97;
      }
    }

    @media (max-width: 480px) {
      :root {
        --text-scale: 0.95;
      }

    .white-btn:hover {

    /* Adding new image credit styles */
  .img-credit,
.unsplash-credit {
  display: none !important;
}

body.preview-credit-mode .img-credit,
body.preview-credit-mode .unsplash-credit {
  display: inline-block !important;
}

body.preview-credit-mode .img-credit,
body.preview-credit-mode .unsplash-credit {
  position: absolute;
  bottom: 8px;
  right: 10px;
  background: rgba(0, 0, 0, 0.55);
  color: #fff !important;
  font-size: 0.68rem;
  line-height: 1.35;
  padding: 4px 8px;
  border-radius: 6px;
  z-index: 5;
  max-width: calc(100% - 20px);
  backdrop-filter: blur(3px);
}

body.preview-credit-mode .img-credit a,
body.preview-credit-mode .unsplash-credit a {
  color: #fff !important;
  text-decoration: underline;
}

@media (max-width: 768px) {
  body.preview-credit-mode .img-credit,
  body.preview-credit-mode .unsplash-credit {
    font-size: 0.62rem;
    padding: 3px 6px;
    bottom: 6px;
    right: 8px;
  }
}

<script>
  (function () {
    const previewHosts = [
      "dashboard.zigrow.com",
      // "127.0.0.1",
      // "localhost"
    ];

    const currentHost = window.location.hostname.toLowerCase();
    const currentPath = window.location.pathname.toLowerCase();

    const isPreviewHost = previewHosts.includes(currentHost);
    const isPreviewPath =
      currentPath.includes("/public/preview/") ||
      currentPath.includes("/preview/");

    if (isPreviewHost || isPreviewPath) {
      document.body.classList.add("preview-credit-mode");
    }
  })();
</script>





  <script>
    (function() {
      const forms = Array.from(document.querySelectorAll('[data-zigrow-form]'));
      if (!forms.length) return;

      function serializeForm(form) {
        const fd = new FormData(form);
        const raw = {};
        for (const [name, value] of fd.entries()) {
          const el = form.elements[name];
          const isGroup = el && (el.length && el[0] && el[0].type === 'checkbox');
          if (isGroup) {
            if (!raw[name]) raw[name] = [];
            raw[name].push(value === '' ? true : value);
          } else {
            raw[name] = value;
          }
        }
        return raw;
      }

      function pickPrimaryValue(raw) {
        if (raw.email && String(raw.email).trim()) return String(raw.email).trim();
        if (raw.phone && String(raw.phone).trim()) return String(raw.phone).trim();
        const nameCombo = [raw.firstName, raw.lastName].filter(Boolean).join(' ').trim();
        if (raw.name && String(raw.name).trim()) return String(raw.name).trim();
        if (nameCombo) return nameCombo;
        if (raw.message && String(raw.message).trim()) return String(raw.message).trim();
        return '';
      }

      forms.forEach((form) => {
        const domainInput = form.querySelector('input[name="domain"]');
        const pageUrlInput = form.querySelector('input[name="page_url"]');
        if (domainInput) domainInput.value = location.host;
        if (pageUrlInput) pageUrlInput.value = location.href;

        let msgContainer = form.querySelector('.form-submit-message');
        if (!msgContainer) {
          msgContainer = document.createElement('div');
          msgContainer.className = 'form-submit-message mt-2 text-sm';
          form.appendChild(msgContainer);
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const submitBtn = form.querySelector('[type="submit"]');
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.dataset._oldText = submitBtn.innerText;
            submitBtn.innerText = 'Submitting...';
          }

          msgContainer.innerText = '';
          msgContainer.style.color = '';

          try {
            const raw = serializeForm(form);
            const body = new URLSearchParams();
            body.set('domain', form.querySelector('input[name="domain"]')?.value || location.host);
            body.set('form_key', form.querySelector('input[name="form_key"]')?.value || 'contact');
            body.set('page_url', form.querySelector('input[name="page_url"]')?.value || location.href);
            body.set('payload', JSON.stringify(raw));

            const primary = pickPrimaryValue(raw);
            if (primary) body.set('value', primary);

            if (raw._company) body.set('_company', raw._company);

            const res = await fetch(form.action, {
              method: 'POST',
              headers: {
                'Accept': 'application/json'
              },
              body
            });

            const data = await res.json().catch(() => ({}));
            if (res.ok && (data.ok ?? true)) {
              form.reset();
              msgContainer.innerText = '✅ Thanks! Your request has been submitted.';
              msgContainer.style.color = '#28a745';
            } else {
              msgContainer.innerText = `❌ ${data.message || `Failed (HTTP ${res.status})`}`;
              msgContainer.style.color = '#dc3545';
            }
          } catch (err) {
            console.error(err);
            msgContainer.innerText = '❌ Something went wrong. Please try again.';
            msgContainer.style.color = '#dc3545';
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerText = submitBtn.dataset._oldText || 'Send';
            }
          }
        });
      });
    })();
  </script>

</body>

<script>
  function importAndOpenBuilder(userId) {
    fetch("https://api.zigrow.com/api/import-template", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          user_id: userId,
        }),
      })
      .then((res) => res.json())
      .then((data) => {
        if (data.success) {
          // window.location.href = `https://api-uat.zigrow.com/builder/editor.html?template=templates/build-with-ai/${userId}/index.html&mode=new`;
            window.location.href = `https://api.zigrow.com/builder/editor.html?template=ai:${userId}&mode=new`;
        } else {
          alert(
            "Failed to import template to builder: " +
            (data.error || "Unknown error")
          );
        }
      })
      .catch(() => {
        alert("Failed to communicate with builder server.");
      });
  }
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {


  
  /* ---------------------------------------------------
    1) Define animation rules per section type
  --------------------------------------------------- */
  const sectionAnimations = {
    hero: "fade-up-big",
    about: ["fade-left", "fade-right"],
    services: "fade-up",
    service: "fade-up",
    portfolio: "zoom-in",
    team: "fade-up-small",
    pricing: "zoom-in",
    contact: "fade-up",
    faq: "fade-right",
    reviews: "fade-up",
    testimonial: "fade-up",
    product: "fade-up",
    logos: "fade-in-slow",
    cta: "zoom-in-big",
    default: ["fade-up", "fade-down"]
  };

  /* ---------------------------------------------------
    2) Utility: pick animation type
  --------------------------------------------------- */
  const pickAnimation = (type, index) => {
    const anim = sectionAnimations[type] || sectionAnimations.default;
    return Array.isArray(anim) ? anim[index % anim.length] : anim;
  };

  /* ---------------------------------------------------
    3) Utility: stagger delays
  --------------------------------------------------- */
  const stagger = (elList, base = 80) => {
    elList.forEach((el, i) => {
      el.setAttribute("data-aos-delay", i * base);
    });
  };

  /* ---------------------------------------------------
    4) Apply to ALL sections automatically
  --------------------------------------------------- */
  document.querySelectorAll("[data-section]").forEach((section, secIndex) => {
    const type = (section.dataset.section || "default").toLowerCase();
    if(type === "footer" ) return; // Skip footer for animations
    const anim = pickAnimation(type, secIndex);

    // SECTION LEVEL ANIMATION
    section.setAttribute("data-aos", anim);

    if(type === "footer") return; // Skip footer for child animations

    // CHILDREN: Cards / Columns / Items
    const children = section.querySelectorAll(`
      .col,
      .col-md-6,
      .col-lg-6,
      .col-lg-4,
      .row > div,
      .card,
      .item,
      .service-card,
      .feature-box,
      .team-card,
      .pricing-card,
      .faq-item,
      .testimonial-card,
      .portfolio-card
    `);

    children.forEach((child, i) => {
      child.setAttribute("data-aos", anim);
      child.setAttribute("data-aos-delay", i * 70);
    });

    // ELEMENT LEVEL: Headings, paragraphs, buttons
    const elements = section.querySelectorAll("h1, h2, h3, p, img, button, a, li");

    elements.forEach((el, i) => {
      el.setAttribute("data-aos", anim);
      el.setAttribute("data-aos-delay", i * 25);
    });

  });

  /* ---------------------------------------------------
     5) MOBILE OPTIMIZED — Disable heavy animations
  --------------------------------------------------- */
  if (window.innerWidth < 576) {
    document.querySelectorAll("[data-aos]").forEach(el => {
      if (["zoom-in-big", "fade-up-big"].includes(el.dataset.aos)) {
        el.setAttribute("data-aos", "fade-up");
      }
    });
  }

  /* ---------------------------------------------------
     6) INIT AOS
  --------------------------------------------------- */
  AOS.init({
    duration: 900,
    easing: "ease-out-cubic",
    once: true,
    offset: 90,

      // 🚫 Disable animation on mobile
  disable: function () {
    return window.innerWidth < 768; // 768px se chhota = Mobile
  }
  });

});
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const processed = new WeakSet();

    function isDataBtn(el) {
      return el && el.matches && el.matches("a[data-btn], button[data-btn]");
    }

    function addWrapClasses(el) {
      el.classList.add("auto-btn-wrap", "d-flex", "flex-row", "flex-wrap", "gap-3");
    }

    function collectAdjacentDataBtns(startEl) {
      const group = [];
      let current = startEl;

      while (isDataBtn(current) && !processed.has(current)) {
        group.push(current);
        current = current.nextElementSibling;
      }

      return group;
    }

    document.querySelectorAll("a[data-btn], button[data-btn]").forEach((btn) => {
      if (processed.has(btn)) return;

      const parent = btn.parentElement;
      if (!parent) return;

      const group = collectAdjacentDataBtns(btn);
      if (!group.length) return;

      group.forEach((el) => processed.add(el));

      const parentTag = parent.tagName.toLowerCase();
      const parentChildren = Array.from(parent.children);

      const parentContainsOnlyThisGroup =
        parentTag === "div" &&
        parentChildren.length === group.length &&
        parentChildren[0] === group[0] &&
        parentChildren[parentChildren.length - 1] === group[group.length - 1];

      if (parentContainsOnlyThisGroup) {
        addWrapClasses(parent);
      } else {
        const wrapper = document.createElement("div");
        addWrapClasses(wrapper);
        parent.insertBefore(wrapper, group[0]);
        group.forEach((el) => wrapper.appendChild(el));
      }
    });
  });
</script>
